{
  "name": "BeszelBar",
  "options": {
    "bundleIdPrefix": "com.nohitdev",
    "bundleShortVersion": "1.0.1",
    "bundleVersion": "2",
    "deploymentTarget": "14.0",
    "xcodeVersion": "15.0",
    "generateEmptyDirectories": true
  },
  "settings": {
    "base": {
      "SWIFT_VERSION": "5.10",
      "MACOSX_DEPLOYMENT_TARGET": "14.0",
      "MARKETING_VERSION": "1.0.1",
      "CURRENT_PROJECT_VERSION": "2",
      "CODE_SIGN_STYLE": "Automatic",
      "ENABLE_HARDENED_RUNTIME": "YES"
    }
  },
  "targets": {
    "BeszelBar": {
      "type": "application",
      "platform": "macOS",
      "sources": [
        {
          "path": "Sources",
          "type": "group"
        },
        {
          "path": "Resources",
          "type": "group"
        }
      ],
      "settings": {
        "base": {
          "INFOPLIST_FILE": "Resources/Info.plist",
          "PRODUCT_BUNDLE_IDENTIFIER": "com.nohitdev.BeszelBar",
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "COMBINE_HIDPI_IMAGES": "YES",
          "LD_RUNPATH_SEARCH_PATHS": [
            "$(inherited)",
            "@executable_path/../Frameworks"
          ]
        }
      },
      "entitlements": {
        "path": "Resources/BeszelBar.entitlements",
        "properties": {
          "com.apple.security.app-sandbox": false
        }
      }
    },
    "BeszelBarTests": {
      "type": "bundle.unit-test",
      "platform": "macOS",
      "sources": [
        "Tests",
        "Sources/Models",
        "Sources/App/AppState.swift",
        "Sources/App/DevelopmentSession.swift",
        "Sources/Services/BeszelAPIService.swift",
        "Sources/Services/HubConnection.swift",
        "Sources/Services/KeychainService.swift",
        "Sources/Dashboard/iOS",
        "Sources/Dashboard/IOSChartCard.swift",
        "Sources/Dashboard/SingleCPUCoreChart.swift",
        "Sources/Dashboard/ChartPreferences.swift",
        "Resources/Localizable.xcstrings"
      ],
      "settings": {
        "base": {
          "GENERATE_INFOPLIST_FILE": "YES",
          "PRODUCT_BUNDLE_IDENTIFIER": "com.nohitdev.BeszelBarTests",
          "TEST_HOST": "$(BUILT_PRODUCTS_DIR)/BeszelBar.app/Contents/MacOS/BeszelBar",
          "BUNDLE_LOADER": "$(TEST_HOST)"
        }
      },
      "dependencies": [
        {
          "target": "BeszelBar"
        }
      ]
    }
  },
  "schemes": {
    "BeszelBar": {
      "build": {
        "targets": {
          "BeszelBar": "all",
          "BeszelBarTests": [
            "test"
          ]
        }
      },
      "test": {
        "targets": [
          "BeszelBarTests"
        ],
        "environmentVariables": {
          "BESZELBAR_TEST_HOST": "1",
          "AppleLanguages": "(fr)"
        }
      }
    }
  }
}
